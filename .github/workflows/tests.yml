name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Project
        uses: ./.github/actions/setup-project

      - name: Build Client And SSR Assets
        run: npm run build:ssr

      - name: Frontend Tests
        run: npm run test:unit

      - name: Tests
        run: composer test
