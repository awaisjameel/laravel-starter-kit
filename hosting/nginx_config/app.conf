server {
    # This is the main server block for the Laravel application.
    # It listens on port 8001 and serves the application from the /srv/laravel-starter-kit/public directory.
    
    listen 8001;
    listen [::]:8001;

    server_name _;

    root /srv/laravel-starter-kit/public;
    index index.php;

    # Generous header buffers: real browsers send many sec-ch-ua/cookie headers
    # that can exceed nginx's small defaults, causing spurious 400s.
    client_header_buffer_size 4k;
    large_client_header_buffers 8 32k;

    access_log /srv/laravel-starter-kit/hosting/nginx_logs/access.log;
    error_log /srv/laravel-starter-kit/hosting/nginx_logs/error.log;

    client_max_body_size 69206016;

    # Laravel Reverb websocket + HTTP API. Reverb's default pusher-protocol
    # paths are /app/{key} (websocket upgrade) and /apps/{id}/... (HTTP API).
    # Matched by exact/prefix path so they never collide with the app's own
    # /app/* Inertia routes (e.g. /app/dashboard, /app/admin/*).
    location = /app/local-key {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 60s;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8080;
    }

    location ^~ /apps/ {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(?:css|gif|ico|jpg|jpeg|js|map|mjs|png|svg|ttf|txt|webp|woff|woff2)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 64k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
